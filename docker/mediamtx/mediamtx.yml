logLevel: info

api: yes
apiAddress: :9997

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8080

rtsp: yes
rtspAddress: :8554

paths:
  all:
    source: publisher
    record: yes
    # Chemin DANS le conteneur où MediaMTX va écrire les fichiers.
    # %path sera remplacé par 'all'.
    # %Y%m%d_%H%M%S assure un nom de fichier unique par session.
    recordPath: /tenuki_storage/videos/%path/%Y%m%d_%H%M%S
    recordFormat: fmp4
